version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/database/db/queries.sql"
    schema: "internal/database/postgres_schema.sql"
    gen:
      go:
        package: "db"
        out: "internal/database/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
