services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-arc}
            POSTGRES_USER: ${POSTGRES_USER:-arc}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arc}
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arc} -d ${POSTGRES_DB:-arc}']
            interval: 2s
            timeout: 5s
            retries: 10
            start_period: 5s
        volumes:
            - postgres-data:/var/lib/postgresql
    scheduler:
        build:
            context: .
            dockerfile: apps/scheduler/Dockerfile
        restart: unless-stopped
        env_file:
            - ./apps/scheduler/.env
        environment:
            DATABASE_URL: postgresql://arc:arc@postgres:5432/arc
        depends_on:
            postgres:
                condition: service_healthy
volumes:
    postgres-data:
