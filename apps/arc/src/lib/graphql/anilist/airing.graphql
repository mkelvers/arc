query AiringAnimePage($page: Int!, $perPage: Int!, $ids: [Int]) {
    Page(page: $page, perPage: $perPage) {
        pageInfo {
            hasNextPage
        }
        media(id_in: $ids, type: ANIME, status: RELEASING, sort: ID) {
            id
            status
            nextAiringEpisode {
                airingAt
                episode
            }
        }
    }
}
