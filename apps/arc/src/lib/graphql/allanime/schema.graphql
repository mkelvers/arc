schema {
    query: Query
}

scalar FlexibleInt
scalar Object
scalar DateTime

enum VaildCountryOriginEnumType {
    ALL
}

enum VaildTranslationTypeEnumType {
    sub
    dub
    raw
}

enum VaildPopularTypeEnumType {
    anime
    manga
    all
}

input SearchInput {
    allowAdult: Boolean
    allowUnknown: Boolean
    includeTypes: Boolean
    query: String
    season: String
    types: [String!]
    year: Int
}

type Query {
    episode(
        showId: String!
        translationType: VaildTranslationTypeEnumType!
        episodeString: String!
    ): Episode
    episodeInfos(showId: String!, episodeNumStart: Float!, episodeNumEnd: Float!): [EpisodeInfo!]
    show(_id: String!): Show
    shows(
        search: SearchInput
        limit: Int
        page: Int
        translationType: VaildTranslationTypeEnumType
        countryOrigin: VaildCountryOriginEnumType
    ): ShowConnection
    queryPopular(
        type: VaildPopularTypeEnumType!
        size: Int!
        dateRange: Int
        isAdult: Boolean
        page: Int
        allowAdult: Boolean
        allowUnknown: Boolean
        denyEcchi: Boolean
    ): RecommendationsResponse
}

type Episode {
    episodeString: String
    uploadDate: DateTime
    sourceUrls: Object
    thumbnail: String
    notes: String
    show: ExpandedShow
    pageStatus: ExpandedPageStatus
    episodeInfo: ExpandedEpisodeInfo
    versionFix: Object
}

type ExpandedShow {
    _id: String
    name: String
    englishName: String
    nativeName: String
    slugTime: String
    thumbnail: String
    tbObj: ExpandedThumbnail
    lastEpisodeInfo: Object
    lastEpisodeDate: DateTime
    type: String
    season: Object
    score: Float
    airedStart: DateTime
    availableEpisodes: Object
    episodeDuration: Object
    episodeCount: String
    lastUpdateEnd: DateTime
    characterCount: Object
    description: String
    broadcastInterval: Object
    banner: String
    characters: Object
    availableEpisodesDetail: Object
    nameOnlyString: String
    isAdult: Boolean
    relatedShows: Object
    relatedMangas: Object
    altNames: Object
    disqusIds: Object
}

type ExpandedPageStatus {
    _id: String
    notes: String
    pageId: String
    showId: String
    views: Int
    likesCount: Int
    commentCount: Int
    dislikesCount: Int
    boostsCount: Int
    reviewCount: Int
    userScoreCount: Int
    userScoreTotalValue: Float
    userScoreAverValue: Float
    viewers: ExpandedViewers
}

type ExpandedViewers {
    firstViewers: ExpandedViewer
    recViewers: ExpandedViewer
}

type ExpandedViewer {
    viewCount: Int
    lastWatchedDate: DateTime
    user: ExpandedUser
}

type ExpandedUser {
    _id: String
    username: String
    displayName: String
    createdAt: DateTime
    picture: String
    reputation: Int
    roleLevel: Int
    brief: String
    followerCount: Int
    followingCount: Int
    pDec: Object
    equippedBadgeKey: String
    equippedBadge: ExpandedBadge
    ugcContributorStats: ExpandedUgcContributorStats
    hideMe: Boolean
}

type ExpandedBadge {
    key: String
    name: String
    rank: Int
    iconPath: String
    date: DateTime
}

type ExpandedUgcContributorStats {
    mediaEditReviewSubmitCount: Int
    mediaEditApprovedCount: Int
    mediaEditRejectedCount: Int
    mediaEditAppliedCount: Int
    mediaEditContributionPoints: Int
    mediaEditModContributionPoints: Int
}

type ExpandedEpisodeInfo {
    notes: String
    thumbnails: Object
    tbObj: ExpandedThumbnail
    vidInforssub: Object
    uploadDates: Object
    vidInforsdub: Object
    vidInforsraw: Object
    description: String
}

type ExpandedThumbnail {
    u: String
    sm: String
    md: String
    ts: String
}

type EpisodeInfo {
    episodeIdNum: FlexibleInt
    notes: String
}

type RelatedShow {
    relation: String
    showId: String
}

type Show {
    _id: String
    aniListId: FlexibleInt
    availableEpisodesDetail: Object
    averageScore: Float
    description: String
    englishName: String
    episodeCount: String
    genres: [String!]
    lastEpisodeTimestamp: Object
    malId: String
    name: String
    nextAiringEpisode: Object
    relatedShows: [RelatedShow!]
    season: Object
    status: String
    thumbnail: String
    type: String
}

type ShowConnection {
    edges: [Show!]
}

type RecommendationsResponse {
    total: Int
    recommendations: [Recommendation!]
}

type Recommendation {
    anyCard: AnyCard
    isManga: Boolean
}

type AnyCard {
    _id: String
    name: String
    englishName: String
    description: String
    malId: FlexibleInt
    aniListId: FlexibleInt
    status: String
    thumbnail: String
    banner: String
    type: String
    season: Object
    episodeCount: FlexibleInt
    popularity: FlexibleInt
    availableEpisodesDetail: Object
    siteRanks: SiteRanks
}

type SiteRanks {
    weekly: SiteRankSnapshot
}

type SiteRankSnapshot {
    position: Int
    total: Int
    score: Float
    delta: Int
    computedAt: DateTime
    windowDays: Int
}
