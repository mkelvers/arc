query FranchiseMedia($malIds: [Int]) {
    Page(perPage: 50) {
        media(idMal_in: $malIds, type: ANIME) {
            id
            idMal
            title {
                english
                romaji
                native
            }
            coverImage {
                extraLarge
                large
            }
            format
            episodes
            duration
            popularity
            averageScore
            description(asHtml: false)
            genres
            relations {
                edges {
                    relationType
                    node {
                        idMal
                    }
                }
            }
        }
    }
}
