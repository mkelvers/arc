query NotificationTargetMedia($ids: [Int!]!) {
    Page(perPage: 50) {
        media(id_in: $ids, type: ANIME) {
            id
            type
            status
            title {
                english
                romaji
                native
            }
            relations {
                edges {
                    relationType
                    node {
                        id
                    }
                }
            }
        }
    }
}
