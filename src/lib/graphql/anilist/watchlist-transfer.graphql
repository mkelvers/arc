query WatchlistTransferAnime($anilistIds: [Int], $malIds: [Int]) {
  anilist: Page(page: 1, perPage: 50) {
    media(id_in: $anilistIds, type: ANIME) {
      id
      idMal
      title {
        english
        romaji
        native
      }
    }
  }
  mal: Page(page: 1, perPage: 50) {
    media(idMal_in: $malIds, type: ANIME) {
      id
      idMal
      title {
        english
        romaji
        native
      }
    }
  }
}
